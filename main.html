<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-JUST Egyptian Arabic Audio Semantic Search</title>
    <!-- page icon -->
    <link rel="icon" href="ui\textures\ej.png" type="image/png">
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons for modern scalable icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom configuration for Tailwind to ensure strict brand colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        egypt: {
                            red: '#CE1126',
                            white: '#FFFFFF',
                            black: '#000000',
                            gray: '#F3F4F6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        arabic: ['"Tajawal"', '"Cairo"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Pulse animation for the recording state */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(206, 17, 38, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(206, 17, 38, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(206, 17, 38, 0); }
        }
        .recording {
            animation: pulse-ring 2s infinite;
            background-color: #CE1126 !important;
            color: white !important;
        }
        body {
            background-color: #F9FAFB;
        }
        /* Custom scrollbar for bubbles */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #CE1126; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a00d1d; }
    </style>
</head>
<body class="font-sans antialiased text-egypt-black min-h-screen flex flex-col">

    <!-- Main Container -->
    <main class="flex-grow w-full max-w-3xl mx-auto px-4 py-12 flex flex-col items-center">
        
        <!-- Header Section -->
        <div class="text-center w-full mb-8">
            <!-- Round Picture Placeholder -->
            <div class="relative inline-block mb-6">
                <!-- Should be padded -->
                <img src="ui\textures\ej.png" 
                     alt="Project Logo" 
                     class="w-32 h-32 px-4 py-4 rounded-full object-cover border-4 border-egypt-black shadow-lg mx-auto transition-transform hover:scale-105 hover:shadow-2xl">
                <div class="absolute bottom-1 right-1 bg-egypt-white rounded-full p-1 border-2 border-egypt-black">
                    <i data-lucide="speech" class="w-5 h-5 text-egypt-red"></i>
                </div>
            </div>
            
            <h1 class="text-4xl font-bold mb-3 tracking-tight">Egyptian Arabic <span class="text-egypt-red">Audio Search</span></h1>
            <p class="text-gray-600 max-w-xl mx-auto text-lg leading-relaxed">
                Find semantic matches in your audio dataset. Use your microphone to speak in Egyptian Arabic, or type your query below to retrieve the most relevant audio files. 🇪🇬 🔊
            </p>
        </div>

        <!-- Search Input Interface -->
        <div class="w-full bg-egypt-white p-2 rounded-2xl shadow-md border border-gray-200 flex items-center gap-2 mb-8 focus-within:ring-2 focus-within:ring-egypt-red focus-within:border-transparent transition-all" dir="rtl">
            
            <!-- Text Input (Appears on the right) -->
            <input type="text" id="searchInput" 
                   class="flex-grow w-full bg-transparent border-none focus:outline-none text-lg px-4 font-arabic" 
                   placeholder="دورلي على مقطع صوتي...">

            <!-- Microphone Button (Next to Search Button) -->
            <button id="micBtn" class="p-4 bg-gray-100 text-egypt-black rounded-xl hover:bg-gray-200 transition-colors flex-shrink-0 relative group" title="Click to speak">
                <i data-lucide="mic" id="micIcon" class="w-6 h-6"></i>
                <span class="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-egypt-black text-white text-xs py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
                    Voice Input
                </span>
            </button>

            <!-- Search Submit Button (Appears on the left) -->
            <button id="searchBtn" class="p-4 bg-egypt-black text-egypt-white rounded-xl hover:bg-gray-800 transition-colors flex-shrink-0 font-semibold flex items-center gap-2" dir="ltr">
                <i data-lucide="search" class="w-5 h-5"></i>
                <span class="hidden sm:inline">Search</span>
            </button>
        </div>

        <!-- Status Indicator -->
        <div id="statusText" class="text-sm font-medium text-gray-500 mb-4 h-5 text-center w-full"></div>

        <!-- Results Interface (Bubbles) -->
        <div id="resultsContainer" class="w-full flex flex-col gap-4">
            <!-- Results will be injected here via JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-gray-500 text-sm border-t border-gray-200 bg-egypt-white mt-auto">
        <p>2026 &bull; Developed by Yousef Gomaa for NLP Project 2 &bull; Egypt-Japan University of Science and Technology</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // API Configuration (Based on the provided FastAPI code)
        const API_URL = "http://127.0.0.1:8000/semantic_query";
        
        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const statusText = document.getElementById('statusText');

        // Event Listeners
        micBtn.addEventListener('click', async () => {
            micBtn.classList.add('bg-red-600', 'animate-pulse');
            statusText.innerText = "Listening to your Egyptian Arabic...";

            try {
                const response = await fetch('http://127.0.0.1:8000/transcribe_mic', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.transcription) {
                    searchInput.value = data.transcription;
                    statusText.innerText = "Transcribed successfully!";
                }
            } catch (error) {
                console.error("Transcription Error:", error);
                statusText.innerText = "Connection to Python ASR failed.";
            } finally {
                micBtn.classList.remove('bg-red-600', 'animate-pulse');
            }
        });

        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query) performSearch(query);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) performSearch(query);
            }
        });

        function resetMicUI() {
            isRecording = false;
            micBtn.classList.remove('recording');
            searchInput.placeholder = "ابحث عن مقطع صوتي... (Search query)";
            statusText.innerText = '';
        }

        // Core Search Function mapping to the provided Python API
        async function performSearch(queryText) {
            resultsContainer.innerHTML = '';
            statusText.innerHTML = '<span class="flex justify-center items-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Searching database...</span>';
            lucide.createIcons();
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: queryText,
                        top_k: 5
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.statusText}`);
                }

                const data = await response.json();
                statusText.innerHTML = `<span class="text-green-600">Found ${data.results.length} matches</span>`;
                renderResults(data.results);
                
            } catch (error) {
                console.error("Search failed:", error);
                statusText.innerHTML = '';
                
                // Demo fallback if backend is offline
                renderErrorBubble(error.message);
                
                // FOR PREVIEW PURPOSES: Show mock results if actual API is unreachable
                setTimeout(() => mockResults(queryText), 1500);
            }
        }

        // Render Results as Bubbles/Cards
        function renderResults(results) {
            resultsContainer.innerHTML = '';
            
            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-gray-500">
                        No matches found. Try a different phrasing.
                    </div>
                `;
                return;
            }

            results.forEach((res, index) => {
                // Calculate percentage score
                const percentScore = (res.score * 100).toFixed(1);
                
                const bubble = document.createElement('div');
                bubble.className = "bg-egypt-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col sm:flex-row sm:items-center gap-4 hover:shadow-md transition-shadow cursor-pointer transform hover:-translate-y-1 duration-200 relative overflow-hidden group";
                
                bubble.innerHTML = `
                    <div class="absolute top-0 left-0 w-1 h-full bg-egypt-red transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300"></div>
                    
                    <div class="flex-shrink-0 w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-egypt-black font-bold text-lg border border-gray-200">
                        #${res.rank}
                    </div>
                    
                    <div class="flex-grow">
                        <h3 class="text-lg font-bold text-egypt-black mb-1 flex items-center gap-2">
                            <i data-lucide="file-audio" class="w-4 h-4 text-egypt-red"></i> 
                            ${res.file_name}
                        </h3>
                        <p class="text-sm text-gray-600 font-arabic line-clamp-2" dir="auto" title="${res.full_transcription || res.best_chunk}">
                            ${res.full_transcription || res.best_chunk || 'Audio transcription not available.'}
                        </p>
                    </div>
                    
                    <div class="flex flex-row sm:flex-col items-center justify-between sm:justify-center gap-2 mt-4 sm:mt-0 min-w-[80px]">
                        <div class="bg-gray-100 px-3 py-1 rounded-full text-xs font-semibold text-gray-700 flex items-center gap-1">
                            <i data-lucide="target" class="w-3 h-3"></i> ${percentScore}%
                        </div>
                        <button class="text-egypt-red bg-red-50 p-2 rounded-full hover:bg-egypt-red hover:text-white transition-colors" title="Play Audio (Demo)">
                            <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                        </button>
                    </div>
                `;
                
                resultsContainer.appendChild(bubble);
            });
            
            lucide.createIcons();
        }

        function renderErrorBubble(msg) {
            resultsContainer.innerHTML = `
                <div class="bg-red-50 p-6 rounded-2xl border border-red-200 text-center flex flex-col items-center">
                    <i data-lucide="alert-triangle" class="w-8 h-8 text-egypt-red mb-2"></i>
                    <h3 class="text-egypt-red font-bold mb-1">Connection Error</h3>
                    <p class="text-sm text-red-800">Ensure the FastAPI backend is running at ${API_URL}</p>
                    <p class="text-xs text-red-500 mt-2">${msg}</p>
                </div>
            `;
            lucide.createIcons();
        }

        // Mock data to demonstrate the UI if the Python backend is disconnected
        function mockResults(query) {
            statusText.innerHTML = '<span class="text-gray-500">Backend offline. Displaying <span class="font-bold text-egypt-black">Preview UI</span> data.</span>';
            const mockData = [
                { rank: 1, file_name: "ARA NORM 00055.wav", score: 0.892, best_chunk: "صوت شخص يتحدث العربية بوضوح", full_transcription: "صوت شخص يتحدث العربية بوضوح في بيئة هادئة" },
                { rank: 2, file_name: "ARA NORM 00030.wav", score: 0.854, best_chunk: "تسجيل صوتي لمحادثة سريعة", full_transcription: "تسجيل صوتي لمحادثة سريعة بين شخصين" },
                { rank: 3, file_name: "ARA NORM 00064.wav", score: 0.761, best_chunk: query, full_transcription: `هذا المقطع يحتوي على كلمات مشابهة لـ: ${query}` },
            ];
            renderResults(mockData);
        }
    </script>
</body>
</html>
